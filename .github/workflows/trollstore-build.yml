name: TrollStore Test Build

on:
  push:
    paths:
      - "*.m"
      - "*.h"
      - "common/**"
      - "trollstore/**"
      - "Assets.xcassets/**"
      - "Icon.png"
      - "LaunchScreen.storyboard"
      - "ent.plist"
      - ".github/workflows/trollstore-build.yml"
  pull_request:
    paths:
      - "*.m"
      - "*.h"
      - "common/**"
      - "trollstore/**"
      - "Assets.xcassets/**"
      - "Icon.png"
      - "LaunchScreen.storyboard"
      - "ent.plist"
      - ".github/workflows/trollstore-build.yml"
  workflow_dispatch:

jobs:
  build-trollstore:
    name: Build ProjectXTroll
    runs-on: macos-14
    timeout-minutes: 45

    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_DEVICE_IP: 127.0.0.1
      FINALPACKAGE: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid xz dpkg make

      - name: Checkout Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Install iPhoneOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          curl -L -o /tmp/iPhoneOS16.5.sdk.tar.xz \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"
          ls -la "$THEOS/sdks"

      - name: Build TrollStore app target
        run: |
          set -euo pipefail
          echo "Repository root: $PWD"
          echo "Building only trollstore/app/Makefile"
          test -f trollstore/app/Makefile
          grep -n "APPLICATION_NAME = ProjectXTroll" trollstore/app/Makefile
          make -C trollstore/app -f Makefile clean all stage messages=yes FINALPACKAGE=0 2>&1 | tee /tmp/projectxtroll-build.log
          if grep -q "ProjectXTweak/" /tmp/projectxtroll-build.log; then
            echo "ERROR: TrollStore workflow unexpectedly built ProjectXTweak. Check workflow/lệnh build đang chạy."
            exit 1
          fi
          echo "Theos obj layout:"
          find trollstore/app/.theos/obj -maxdepth 8 -print | sort || true
          echo "Theos obj files:"
          find trollstore/app/.theos/obj -maxdepth 10 -type f -exec ls -lh {} \; | sort || true
          echo "Theos staged layout:"
          find trollstore/app/.theos/_ -maxdepth 8 -print | sort || true
          echo "Theos packages:"
          find trollstore/app/packages -maxdepth 2 -type f -print | sort || true

      - name: Package TrollStore .tipa
        run: |
          set -euo pipefail
          WORK_DIR="trollstore/app/tipa-work"
          rm -rf "$WORK_DIR" trollstore/app/tipa trollstore/app/ProjectXTroll.tipa
          mkdir -p "$WORK_DIR"

          DEB_PATH="$(find trollstore/app/packages -type f -name "*.deb" | sort | tail -n 1 || true)"
          if [ -n "$DEB_PATH" ] && [ -f "$DEB_PATH" ]; then
            echo "Extracting app from package: $DEB_PATH"
            dpkg-deb -x "$DEB_PATH" "$WORK_DIR"
            echo "Extracted package layout:"
            find "$WORK_DIR" -maxdepth 8 -print | sort || true
          fi

          echo "Searching for ProjectXTroll.app candidates..."
          APP_PATH=""
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue
            echo "Candidate: $candidate"
            if [ ! -f "$candidate/Info.plist" ]; then
              echo "  Info.plist missing; injecting trollstore/app/Info.plist"
              cp trollstore/app/Info.plist "$candidate/Info.plist"
            fi
            EXECUTABLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$candidate/Info.plist" 2>/dev/null || true)"
            if [ -z "$EXECUTABLE" ]; then
              echo "  skip: missing CFBundleExecutable"
              continue
            fi
            if [ ! -f "$candidate/$EXECUTABLE" ]; then
              echo "  executable missing from app bundle; searching Theos output for $EXECUTABLE"
              EXEC_SOURCE="$(find trollstore/app/.theos -type f -name "$EXECUTABLE" ! -path "*/$EXECUTABLE.app/*" | sort | head -n 1)"
              if [ -z "$EXEC_SOURCE" ] || [ ! -f "$EXEC_SOURCE" ]; then
                echo "  searching for any Mach-O executable output as fallback"
                EXEC_SOURCE="$(find trollstore/app/.theos -type f ! -path "*/ProjectXTroll.app/*" -perm -111 -exec sh -c 'file "$1" | grep -q "Mach-O"' sh {} \; -print | sort | head -n 1)"
              fi
              if [ -z "$EXEC_SOURCE" ] || [ ! -f "$EXEC_SOURCE" ]; then
                echo "  skip: missing executable $candidate/$EXECUTABLE and no standalone build output found"
                echo "  files at app root:"
                find "$candidate" -maxdepth 1 -type f -print || true
                echo "  possible executable outputs:"
                find trollstore/app/.theos -type f -exec sh -c 'printf "%s: " "$1"; file "$1"' sh {} \; | sort || true
                continue
              fi
              echo "  copying executable from $EXEC_SOURCE"
              cp "$EXEC_SOURCE" "$candidate/$EXECUTABLE"
              chmod 755 "$candidate/$EXECUTABLE"
            fi
            APP_PATH="$candidate"
            break
          done < <(find "$WORK_DIR" trollstore/app/.theos -type d -name ProjectXTroll.app | sort)

          if [ -z "$APP_PATH" ]; then
            echo "No valid ProjectXTroll.app candidate found under extracted package or trollstore/app/.theos"
            echo "All app candidates:"
            find "$WORK_DIR" trollstore/app/.theos -maxdepth 8 -type d -name "*.app" -print || true
            echo "All files named ProjectXTroll or executable-like outputs:"
            find "$WORK_DIR" trollstore/app/.theos -maxdepth 12 -type f \( -name "ProjectXTroll" -o -perm -111 \) -exec ls -lh {} \; || true
            find trollstore/app/.theos -maxdepth 8 -type d -name "*.app" -print || true
            exit 1
          fi

          echo "Packaging app: $APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")"
          if [ -z "$EXECUTABLE" ] || [ ! -f "$APP_PATH/$EXECUTABLE" ]; then
            echo "Main executable '$EXECUTABLE' missing from $APP_PATH"
            find "$APP_PATH" -maxdepth 1 -type f -print
            exit 1
          fi
          if [ ! -x "$APP_PATH/$EXECUTABLE" ]; then
            echo "Main executable '$EXECUTABLE' exists but is not executable; fixing mode"
            chmod 755 "$APP_PATH/$EXECUTABLE"
          fi
          /usr/libexec/PlistBuddy -c "Print :TSRootBinaries" "$APP_PATH/Info.plist"
          if [ ! -f "$APP_PATH/weaponx_root_helper" ]; then
            echo "weaponx_root_helper missing from app bundle; copying from helper build output"
            HELPER_BIN="$(find trollstore/helper/.theos/obj -type f -name weaponx_root_helper | head -n 1)"
            if [ -z "$HELPER_BIN" ] || [ ! -f "$HELPER_BIN" ]; then
              echo "weaponx_root_helper binary not found under trollstore/helper/.theos/obj"
              find trollstore/helper/.theos -maxdepth 8 -type f -name "weaponx_root_helper" -print || true
              exit 1
            fi
            cp "$HELPER_BIN" "$APP_PATH/weaponx_root_helper"
            chmod 755 "$APP_PATH/weaponx_root_helper"
          fi
          test -f "$APP_PATH/weaponx_root_helper"

          echo "Re-signing and verifying TrollStore entitlements..."
          APP_ENT="$PWD/trollstore/app/entitlements.plist"
          HELPER_ENT="$PWD/trollstore/helper/entitlements.plist"
          test -f "$APP_ENT"
          test -f "$HELPER_ENT"
          ldid -S"$APP_ENT" "$APP_PATH/$EXECUTABLE"
          ldid -S"$HELPER_ENT" "$APP_PATH/weaponx_root_helper"

          APP_ENT_DUMP="/tmp/projectxtroll-main.entitlements.plist"
          HELPER_ENT_DUMP="/tmp/projectxtroll-helper.entitlements.plist"
          ldid -e "$APP_PATH/$EXECUTABLE" > "$APP_ENT_DUMP"
          ldid -e "$APP_PATH/weaponx_root_helper" > "$HELPER_ENT_DUMP"
          echo "Main executable entitlements:"
          cat "$APP_ENT_DUMP"
          echo "Root helper entitlements:"
          cat "$HELPER_ENT_DUMP"

          require_entitlement() {
            local plist="$1"
            local key="$2"
            if ! /usr/libexec/PlistBuddy -c "Print :$key" "$plist" >/dev/null 2>&1; then
              echo "Missing entitlement '$key' in $plist"
              exit 1
            fi
          }

          require_entitlement "$APP_ENT_DUMP" "platform-application"
          require_entitlement "$APP_ENT_DUMP" "com.apple.private.persona-mgmt"
          require_entitlement "$APP_ENT_DUMP" "com.apple.private.security.no-sandbox"
          require_entitlement "$APP_ENT_DUMP" "com.apple.private.security.no-container"
          require_entitlement "$APP_ENT_DUMP" "com.apple.private.MobileContainerManager.allowed"
          require_entitlement "$APP_ENT_DUMP" "com.apple.private.security.container-manager"
          require_entitlement "$HELPER_ENT_DUMP" "platform-application"
          require_entitlement "$HELPER_ENT_DUMP" "com.apple.private.persona-mgmt"
          require_entitlement "$HELPER_ENT_DUMP" "com.apple.private.security.no-sandbox"
          require_entitlement "$HELPER_ENT_DUMP" "com.apple.private.security.no-container"

          rm -rf trollstore/app/tipa
          mkdir -p trollstore/app/tipa/Payload
          cp -a "$APP_PATH" trollstore/app/tipa/Payload/
          (cd trollstore/app/tipa && zip -qry ../ProjectXTroll.tipa Payload)
          ls -lh trollstore/app/ProjectXTroll.tipa

      - name: Upload TrollStore build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projectxtroll-build-output
          path: |
            trollstore/app/ProjectXTroll.tipa
            trollstore/app/packages/**
            trollstore/app/.theos/obj/**
            trollstore/helper/.theos/obj/**
          if-no-files-found: ignore

      - name: Upload ProjectXTroll tipa
        uses: actions/upload-artifact@v4
        with:
          name: ProjectXTroll.tipa
          path: trollstore/app/ProjectXTroll.tipa
          if-no-files-found: error
